<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nexo-legal/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="اشتراكات البرامج الرقمية في مصر بالجنيه المصري — ادفع بـ InstaPay أو Vodafone Cash وفريق NEXO يفعّل اشتراكك.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NEXO Subs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NEXO Subs</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2F55F0">

  <style id="nexo-splash-style">
    html, body { margin: 0; background: #ffffff; }
    #nexo-splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; z-index: 9999; }
    #nexo-splash img { width: 96px; height: 96px; border-radius: 22px; }
    #nexo-splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #EEF0F5; overflow: hidden; }
    #nexo-splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #2F55F0;
      border-radius: 4px; animation: nexo-load 1.1s ease-in-out infinite; }
    #nexo-splash p { margin: 0; color: #46506B; font-size: 14px; }
    @keyframes nexo-load { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div id="nexo-splash">
    <img src="icons/Icon-192.png" alt="NEXO">
    <div class="bar"></div>
    <p>جاري التحميل…</p>
  </div>
  <script>
    // نشيل شاشة التحميل أول ما Flutter يرسم أول صفحة
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('nexo-splash'); if (s) s.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
